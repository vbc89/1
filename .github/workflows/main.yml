name: All-Connect Remote Desktop (6 Hours)

on:
  workflow_dispatch:
    inputs:
      os_image:
        description: "OS Image"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      remote_method:
        description: "Primary Remote Method"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - rdp
          - ssh
          - xrdp
          - vnc
          - rustdesk
          - teamviewer
          - anydesk
          - chrome-remote-desktop
          - parsec
      tunnels:
        description: "Tunnels"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - tailscale
          - ngrok
          - cloudflare-tunnel
          - localhost-run
          - bore-tunnel
          - telebit
          - pagekite
          - localtunnel
          - expose
      ts_authkey:
        description: "Tailscale Auth Key (required for tailscale)"
        required: false
      ngrok_token:
        description: "Ngrok Authtoken (required for ngrok)"
        required: false
      cf_token:
        description: "Cloudflare Token (optional)"
        required: false
      teamviewer_id:
        description: "TeamViewer ID (optional)"
        required: false
      anydesk_id:
        description: "AnyDesk ID (optional)"
        required: false
      crd_code:
        description: "Chrome Remote Desktop Code (optional)"
        required: false
      crd_pin:
        description: "CRD PIN (6-12 digits)"
        required: false
        default: "123456"
      runtime_minutes:
        description: "Runtime (max 360 = 6 hours)"
        required: false
        default: "360"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Inputs
        run: |
          OS="${{ inputs.os_image }}"
          METHOD="${{ inputs.remote_method }}"
          TUNNEL="${{ inputs.tunnels }}"

          if [[ "$METHOD" != "all" ]]; then
            VALID="false"
            case "$OS" in
              windows-latest)
                case "$METHOD" in
                  rdp|rustdesk|teamviewer|anydesk|chrome-remote-desktop|parsec) VALID="true" ;;
                esac
                ;;
              ubuntu-latest)
                case "$METHOD" in
                  ssh|xrdp|vnc|rustdesk|teamviewer|anydesk|chrome-remote-desktop|parsec) VALID="true" ;;
                esac
                ;;
              macos-latest)
                case "$METHOD" in
                  ssh|vnc|rustdesk|teamviewer|anydesk|chrome-remote-desktop|parsec) VALID="true" ;;
                esac
                ;;
            esac
            if [[ "$VALID" == "false" ]]; then
              echo "Error: Method $METHOD is not available on $OS"
              exit 1
            fi
          fi

          if [[ "$TUNNEL" == "all" || "$TUNNEL" == "tailscale" ]] && [[ -z "${{ inputs.ts_authkey }}" ]]; then
            echo "::warning::Tailscale selected but no authkey provided"
          fi
          if [[ "$TUNNEL" == "all" || "$TUNNEL" == "ngrok" ]] && [[ -z "${{ inputs.ngrok_token }}" ]]; then
            echo "::warning::Ngrok selected but no token provided"
          fi
          echo "Validation passed"

  remote-desktop:
    needs: validate
    runs-on: ${{ inputs.os_image }}
    timeout-minutes: 370
    env:
      USER_WIN: Admin
      PASS_WIN: Admin@12345
      USER_NIX: runner
      PASS_NIX: runner@12345
      RDPASS: RustDesk@2026Secure!

    steps:
      # ============================================================
      # PHASE 1: INSTALL UBUNTU DESKTOP & XRDP (with dependency fixes)
      # ============================================================
      - name: PHASE 1 - Install Ubuntu Desktop & XRDP
        if: ${{ inputs.os_image == 'ubuntu-latest' }}
        continue-on-error: false
        run: |
          echo "=========================================="
          echo "  PHASE 1: INSTALLING DESKTOP & XRDP"
          echo "=========================================="
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update -y

          # CRITICAL FIX: Resolve any broken dependencies first
          echo "Fixing any broken dependencies..."
          sudo apt-get install -f -y
          sudo apt-get --fix-broken install -y

          # Fix for Ubuntu 24.04: install dependencies first to avoid exit code 100
          echo "Installing XRDP dependencies..."
          sudo apt-get install -y libfuse2t64 libopus0 xserver-xorg-core xserver-xorg-input-all \
            gsettings-desktop-schemas policykit-1 python3-psutil python3-xdg xbase-clients \
            xserver-xorg-video-dummy libegl1 libxcvt0

          # Install xrdp and xorgxrdp separately with --no-install-recommends
          echo "Installing XRDP..."
          sudo apt-get install -y --no-install-recommends xrdp xorgxrdp

          # Install a lightweight desktop (xfce4) instead of full ubuntu-desktop for speed
          echo "Installing XFCE4 desktop (lightweight)..."
          sudo apt-get install -y xfce4 xfce4-goodies

          # Also install common apps
          sudo apt-get install -y curl wget net-tools iputils-ping firefox

          echo "=========================================="
          echo "  DESKTOP & XRDP INSTALLATION COMPLETE"
          echo "=========================================="

      # ============================================================
      # PHASE 2: CONFIGURE DESKTOP ENVIRONMENT
      # ============================================================
      - name: PHASE 2 - Configure Ubuntu Desktop for Remote Access
        if: ${{ inputs.os_image == 'ubuntu-latest' }}
        continue-on-error: false
        run: |
          echo "=========================================="
          echo "  PHASE 2: CONFIGURING DESKTOP"
          echo "=========================================="

          # Ensure xrdp directories exist
          sudo mkdir -p /etc/xrdp

          # Configure XRDP for XFCE4 session (lightweight, reliable)
          sudo tee /etc/xrdp/startwm.sh > /dev/null << 'XRDP_EOF'
          #!/bin/sh
          if [ -r /etc/profile ]; then
            . /etc/profile
          fi
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          startxfce4
          XRDP_EOF
          sudo chmod +x /etc/xrdp/startwm.sh

          # Configure XRDP settings
          sudo sed -i 's/^port=.*/port=3389/' /etc/xrdp/xrdp.ini 2>/dev/null || true
          sudo sed -i 's/^max_bpp=.*/max_bpp=32/' /etc/xrdp/xrdp.ini 2>/dev/null || true
          sudo sed -i 's/^xserverbpp=.*/xserverbpp=32/' /etc/xrdp/xrdp.ini 2>/dev/null || true

          # Enable graphical target
          sudo systemctl set-default graphical.target 2>/dev/null || true

          # Set passwords
          sudo usermod -aG ssl-cert $USER
          echo "runner:$PASS_NIX" | sudo chpasswd
          sudo usermod -p $(openssl passwd -1 "$PASS_NIX") runner 2>/dev/null || true
          sudo usermod -s /bin/bash runner 2>/dev/null || true

          # Create .xsession for XFCE
          printf 'startxfce4\n' | sudo tee /home/runner/.xsession > /dev/null
          sudo chown runner:runner /home/runner/.xsession 2>/dev/null || true
          sudo chmod 644 /home/runner/.xsession 2>/dev/null || true

          printf 'startxfce4\n' > ~/.xsession
          chmod 644 ~/.xsession

          echo "=========================================="
          echo "  DESKTOP CONFIGURATION COMPLETE"
          echo "=========================================="

      # ============================================================
      # PHASE 3: START ALL CONNECTIVITY SERVICES
      # ============================================================
      - name: PHASE 3A - Start XRDP Service
        if: ${{ inputs.os_image == 'ubuntu-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'xrdp') }}
        continue-on-error: false
        run: |
          echo "=== Starting XRDP ==="
          sudo systemctl enable xrdp || true
          sudo systemctl restart xrdp || sudo service xrdp restart || true
          sleep 3
          sudo systemctl status xrdp --no-pager || true

          sudo ufw allow 3389/tcp 2>/dev/null || true
          sudo iptables -I INPUT -p tcp --dport 3389 -j ACCEPT 2>/dev/null || true
          sudo ss -tlnp | grep 3389 || sudo netstat -tlnp | grep 3389 || echo "WARNING: XRDP not listening"

          echo "XRDP: user=runner / pass=$PASS_NIX"

      - name: PHASE 3B - Start SSH Service
        if: ${{ inputs.os_image != 'windows-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'ssh') }}
        continue-on-error: false
        run: |
          echo "=== Starting SSH ==="

          if [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            sudo systemsetup -setremotelogin on
          else
            sudo apt-get install -y openssh-server
            sudo systemctl enable ssh || true
            sudo systemctl start ssh || sudo service ssh start || true

            sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak

            printf '%s\n' 'PasswordAuthentication yes' 'PermitRootLogin no' 'ChallengeResponseAuthentication yes' 'UsePAM yes' | sudo tee /etc/ssh/sshd_config.d/99-github-actions.conf > /dev/null

            sudo sed -i '/^DenyUsers/d' /etc/ssh/sshd_config
            sudo sed -i '/^DenyGroups/d' /etc/ssh/sshd_config

            sudo systemctl restart ssh || sudo service ssh restart || true
            sleep 2
            sudo systemctl status ssh --no-pager || true
          fi

          echo "runner:$PASS_NIX" | sudo chpasswd
          sudo usermod -p $(openssl passwd -1 "$PASS_NIX") runner 2>/dev/null || true
          sudo passwd -S runner || true

          sudo ufw allow 22/tcp 2>/dev/null || true
          sudo iptables -I INPUT -p tcp --dport 22 -j ACCEPT 2>/dev/null || true
          sudo ss -tlnp | grep :22 || sudo netstat -tlnp | grep :22 || echo "WARNING: SSH not listening"

          echo "SSH: user=runner / pass=$PASS_NIX"

      - name: PHASE 3C - Install RustDesk (Windows MSI + Screenshot)
        if: ${{ inputs.os_image == 'windows-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'rustdesk') }}
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "=== Installing RustDesk (Windows) ==="
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            try {
              $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
              $installerPath = "$env:TEMP\rustdesk.msi"
              Invoke-WebRequest -Uri $rdUrl -OutFile $installerPath
              Start-Process msiexec.exe -ArgumentList "/i","`"$installerPath`"","/quiet","/norestart" -Wait
              Remove-Item $installerPath -Force
            } catch {
              Write-Host "MSI install failed, trying winget…"
              winget install --id RustDesk.RustDesk -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            }
          }
          if (-not (Test-Path $rdExe)) { Write-Error "RustDesk not found after install"; exit 1 }
          Write-Host "RustDesk installed."

      - name: PHASE 3C2 - Open RustDesk Ports (Windows Firewall)
        if: ${{ inputs.os_image == 'windows-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'rustdesk') }}
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "=== Opening RustDesk Firewall Ports ==="
          for ($p=21115; $p -le 21119; $p++) {
            $name = "APP-PORT-TCP-$p"
            netsh advfirewall firewall delete rule name=$name 2>$null
            netsh advfirewall firewall add rule name=$name dir=in action=allow protocol=TCP localport=$p
          }
          $udpName = "APP-PORT-UDP-21116"
          netsh advfirewall firewall delete rule name=$udpName 2>$null
          netsh advfirewall firewall add rule name=$udpName dir=in action=allow protocol=UDP localport=21116
          Write-Host "Firewall rules added."

      - name: PHASE 3C3 - Launch RustDesk + Screenshot to Gofile (Windows)
        if: ${{ inputs.os_image == 'windows-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'rustdesk') }}
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "=== Launching RustDesk ==="
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          Start-Process -FilePath $rdExe -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          # Take screenshot
          $screenshotPath = "$env:TEMP\rustdesk_screenshot.png"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          Write-Host "Screenshot saved to $screenshotPath"

          # Upload to Gofile
          try {
            $curlResult = curl.exe -F "file=@$screenshotPath" https://store1.gofile.io/uploadFile
            $json = $curlResult | ConvertFrom-Json
            if ($json.status -eq "ok") {
              $screenshotUrl = $json.data.downloadPage
              "SCREENSHOT_URL=$screenshotUrl" | Out-File -Append $env:GITHUB_ENV
              Write-Host "Screenshot uploaded: $screenshotUrl"
            }
          } catch {
            Write-Host "Screenshot upload failed: $_"
          }

          # Get RustDesk ID
          Start-Sleep -Seconds 5
          $rdId = & $rdExe --get-id 2>$null
          if ($rdId) {
            "RUSTDESK_ID=$rdId" | Out-File -Append $env:GITHUB_ENV
            Write-Host "RustDesk ID: $rdId"
          }

      # ============================================================
      # PHASE 3C4 - LINUX RUSTDESK + SCREENSHOT (NEW)
      # ============================================================
      - name: PHASE 3C4 - Start RustDesk + Screenshot (Linux)
        if: ${{ inputs.os_image == 'ubuntu-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'rustdesk') }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting RustDesk (Linux) + Screenshot ==="

          # Install dependencies for screenshot
          sudo apt-get install -y -f scrot xclip imagemagick curl jq

          LATEST=$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          if [[ -z "$LATEST" ]]; then
            LATEST="1.4.6"
          fi

          wget -q "https://github.com/rustdesk/rustdesk/releases/download/${LATEST}/rustdesk-${LATEST}-x86_64.deb" -O /tmp/rustdesk.deb
          sudo dpkg -i /tmp/rustdesk.deb 2>/dev/null || sudo apt-get install -f -y

          mkdir -p ~/.config/rustdesk
          echo "$RDPASS" > ~/.config/rustdesk/password
          chmod 600 ~/.config/rustdesk/password

          # Start RustDesk
          rustdesk --password "$RDPASS" &
          sleep 15

          # Get RustDesk ID
          RDID=$(rustdesk --get-id 2>/dev/null || echo "check-app")
          echo "RUSTDESK_ID=$RDID" >> $GITHUB_ENV
          echo "RUSTDESK_PASS=$RDPASS" >> $GITHUB_ENV
          echo "RustDesk ID: $RDID"
          echo "RustDesk Pass: $RDPASS"

          # Take screenshot of RustDesk window showing ID
          sleep 5
          echo "Taking screenshot..."

          # Method 1: Try to capture specific window using xwd
          export DISPLAY=:1

          # Start a dummy X server if needed for screenshot
          if ! xdpyinfo >/dev/null 2>&1; then
            echo "No X display available, trying to start virtual display..."
            sudo apt-get install -y xvfb
            Xvfb :1 -screen 0 1280x720x24 &
            export DISPLAY=:1
            sleep 3
          fi

          # Take screenshot using ImageMagick
          SCREENSHOT_PATH="/tmp/rustdesk_screenshot_linux.png"
          import -window root "$SCREENSHOT_PATH" 2>/dev/null || \
          scrot "$SCREENSHOT_PATH" 2>/dev/null || \
          xwd -root -out /tmp/screenshot.xwd 2>/dev/null && convert /tmp/screenshot.xwd "$SCREENSHOT_PATH" 2>/dev/null

          if [[ -f "$SCREENSHOT_PATH" ]]; then
            echo "Screenshot saved to $SCREENSHOT_PATH"

            # Upload to Gofile
            UPLOAD_RESULT=$(curl -s -F "file=@$SCREENSHOT_PATH" https://store1.gofile.io/uploadFile 2>/dev/null)
            if [[ -n "$UPLOAD_RESULT" ]]; then
              SCREENSHOT_URL=$(echo "$UPLOAD_RESULT" | jq -r '.data.downloadPage // empty' 2>/dev/null)
              if [[ -n "$SCREENSHOT_URL" && "$SCREENSHOT_URL" != "null" ]]; then
                echo "SCREENSHOT_URL=$SCREENSHOT_URL" >> $GITHUB_ENV
                echo "Screenshot uploaded: $SCREENSHOT_URL"
              else
                echo "Screenshot upload parse failed"
                echo "Raw response: $UPLOAD_RESULT"
              fi
            else
              echo "Screenshot upload failed (no response)"
            fi
          else
            echo "Screenshot capture failed"
          fi

          # Open firewall ports
          sudo ufw allow 21115:21119/tcp 2>/dev/null || true
          sudo iptables -I INPUT -p tcp --dport 21115:21119 -j ACCEPT 2>/dev/null || true
          sudo iptables -I INPUT -p udp --dport 21116 -j ACCEPT 2>/dev/null || true

      - name: PHASE 3C5 - Start RustDesk (macOS)
        if: ${{ inputs.os_image == 'macos-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'rustdesk') }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting RustDesk (macOS) ==="
          brew install --cask rustdesk
          open /Applications/RustDesk.app
          sleep 10
          RDID=$(rustdesk --get-id 2>/dev/null || echo "check-app")
          echo "RUSTDESK_ID=$RDID" >> $GITHUB_ENV
          echo "RUSTDESK_PASS=$RDPASS" >> $GITHUB_ENV
          echo "RustDesk ID: $RDID"
          echo "RustDesk Pass: $RDPASS"

      # ============================================================
      # PHASE 0 (MOVED LAST): START CHROME REMOTE DESKTOP
      # CRD codes expire quickly, so start it AFTER everything else is ready
      # ============================================================
      - name: PHASE 0 - Start Chrome Remote Desktop (Last - Code Fresh)
        if: ${{ inputs.remote_method == 'all' || inputs.remote_method == 'chrome-remote-desktop' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=========================================="
          echo "  PHASE 0: STARTING CRD (FRESH CODE)"
          echo "=========================================="
          if [[ -z "${{ inputs.crd_code }}" ]]; then
            echo "No CRD code provided, skipping"
            exit 0
          fi
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            curl -fsSL -o "$TEMP/crd.msi" "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
            msiexec /i "$TEMP/crd.msi" /quiet /norestart
            "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe" \
              --code="${{ inputs.crd_code }}" \
              --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
              --name="$COMPUTERNAME" \
              --pin="${{ inputs.crd_pin }}"
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install --cask chrome-remote-desktop
            /Applications/Chrome\ Remote\ Desktop\ Host.app/Contents/MacOS/remoting_start_host \
              --code="${{ inputs.crd_code }}" \
              --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
              --name="$HOSTNAME" \
              --pin="${{ inputs.crd_pin }}"
          else
            # Ubuntu: Install CRD with automatic dependency resolution
            export DEBIAN_FRONTEND=noninteractive
            wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
            # Use apt-get install instead of dpkg to auto-resolve dependencies
            sudo apt-get update -y
            sudo apt-get install -y -f ./chrome-remote-desktop_current_amd64.deb || \
            (sudo dpkg -i chrome-remote-desktop_current_amd64.deb; sudo apt-get install -f -y)

            DISPLAY= /opt/google/chrome-remote-desktop/start-host \
              --code="${{ inputs.crd_code }}" \
              --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
              --name="$HOSTNAME" \
              --pin="${{ inputs.crd_pin }}"
          fi
          echo "CRD launched with PIN ${{ inputs.crd_pin }}"
          echo "CRD_STATUS=ACTIVE" >> $GITHUB_ENV

      # ============================================================
      # PHASE 4: START TUNNELS
      # ============================================================
      - name: PHASE 4A - Tailscale Tunnel
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'tailscale' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting Tailscale ==="
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            curl -fsSL -o "$TEMP/tailscale.msi" "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
            msiexec /i "$TEMP/tailscale.msi" /quiet /norestart
            "/c/Program Files/Tailscale/tailscale.exe" logout 2>/dev/null || true
            "/c/Program Files/Tailscale/tailscale.exe" up --authkey="${{ inputs.ts_authkey }}" --hostname="gh-${{ github.run_id }}" --accept-dns --accept-routes
            IP=$("/c/Program Files/Tailscale/tailscale.exe" ip -4 | head -1)
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install tailscale
            sudo tailscale up --authkey="${{ inputs.ts_authkey }}" --hostname="gh-${{ github.run_id }}"
            IP=$(sudo tailscale ip -4 | head -1)
          else
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo tailscale up --authkey="${{ inputs.ts_authkey }}" --hostname="gh-${{ github.run_id }}" --accept-dns --accept-routes
            IP=$(tailscale ip -4 | head -1)
          fi
          echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
          echo "Tailscale IP: $IP"

      - name: PHASE 4B - Ngrok Tunnel
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'ngrok' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting Ngrok ==="
          NGROK=""
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            choco install ngrok -y 2>/dev/null || true
            if command -v ngrok &> /dev/null; then
              NGROK="ngrok"
            else
              curl -fsSL -o "$TEMP/ngrok.zip" "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" 2>/dev/null || \
                curl -fsSL -o "$TEMP/ngrok.zip" "https://github.com/ngrok/ngrok/releases/latest/download/ngrok-stable-windows-amd64.zip" 2>/dev/null || true
              if [[ -f "$TEMP/ngrok.zip" ]]; then
                unzip -o "$TEMP/ngrok.zip" -d "$TEMP" 2>/dev/null
                NGROK="$TEMP/ngrok.exe"
              fi
            fi
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install ngrok/ngrok/ngrok 2>/dev/null || brew install ngrok 2>/dev/null || true
            NGROK="ngrok"
          else
            # Ubuntu: try multiple install methods
            if command -v ngrok &> /dev/null; then
              NGROK="ngrok"
            else
              # Try snap first
              sudo snap install ngrok 2>/dev/null || true
              if command -v ngrok &> /dev/null; then
                NGROK="ngrok"
              else
                # Try direct download
                curl -fsSL -o /tmp/ngrok.tgz "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" 2>/dev/null || \
                  curl -fsSL -o /tmp/ngrok.tgz "https://github.com/ngrok/ngrok/releases/latest/download/ngrok-stable-linux-amd64.tgz" 2>/dev/null || true
                if [[ -f "/tmp/ngrok.tgz" ]]; then
                  tar xzf /tmp/ngrok.tgz -C /tmp 2>/dev/null
                  chmod +x /tmp/ngrok
                  NGROK="/tmp/ngrok"
                fi
              fi
            fi
          fi

          if [[ -z "$NGROK" ]] || [[ ! -x "$NGROK" ]]; then
            echo "Ngrok binary not found, trying npm install..."
            sudo apt-get install -y npm 2>/dev/null || true
            npm install -g ngrok 2>/dev/null || true
            if command -v ngrok &> /dev/null; then
              NGROK="ngrok"
            else
              echo "Ngrok installation failed completely"
              exit 1
            fi
          fi

          if [[ -n "${{ inputs.ngrok_token }}" ]]; then
            $NGROK authtoken "${{ inputs.ngrok_token }}"
          fi

          case "${{ inputs.remote_method }}" in
            rdp|xrdp|vnc) PORT=3389 ;;
            ssh) PORT=22 ;;
            rustdesk) PORT=21115 ;;
            *) PORT=3389 ;;
          esac

          $NGROK tcp $PORT > ngrok.log 2>&1 &
          sleep 15
          URL=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null | grep -o '"public_url":"tcp://[^"]*' | cut -d'"' -f4)
          if [[ -n "$URL" ]]; then
            echo "NGROK_URL=$URL" >> $GITHUB_ENV
            echo "NGROK_PORT=$(echo $URL | cut -d: -f3)" >> $GITHUB_ENV
            echo "Ngrok: $URL"
          else
            echo "NGROK_URL=pending" >> $GITHUB_ENV
            echo "Ngrok URL not yet available, check ngrok.log"
            cat ngrok.log 2>/dev/null || true
          fi

      - name: PHASE 4C - Cloudflare Tunnel
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'cloudflare-tunnel' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting Cloudflare Tunnel ==="
          if [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install cloudflared 2>/dev/null || true
          elif [[ "${{ inputs.os_image }}" == "ubuntu-latest" ]]; then
            curl -fsSL -o /tmp/cloudflared.deb \
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" 2>/dev/null || true
            if [[ -f "/tmp/cloudflared.deb" ]]; then
              sudo dpkg -i /tmp/cloudflared.deb 2>/dev/null || sudo apt-get install -f -y 2>/dev/null || true
            fi
          else
            echo "Cloudflare Tunnel not available on Windows"
            exit 0
          fi
          if command -v cloudflared &> /dev/null; then
            case "${{ inputs.remote_method }}" in
              ssh) CF_PORT=22 ;;
              rdp|xrdp|vnc) CF_PORT=3389 ;;
              rustdesk) CF_PORT=21115 ;;
              *) CF_PORT=3389 ;;
            esac
            nohup cloudflared tunnel --url "tcp://localhost:$CF_PORT" > cf.log 2>&1 &
            sleep 15
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            if [[ -n "$URL" ]]; then
              echo "CF_URL=$URL" >> $GITHUB_ENV
              echo "Cloudflare: $URL"
            else
              echo "CF_URL=pending" >> $GITHUB_ENV
            fi
          fi

      - name: PHASE 4D - Localhost.run Tunnel
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'localhost-run' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting Localhost.run ==="
          case "${{ inputs.remote_method }}" in
            ssh) LOCAL_PORT=22 ;;
            rdp|xrdp|vnc) LOCAL_PORT=3389 ;;
            rustdesk) LOCAL_PORT=21115 ;;
            *) LOCAL_PORT=3389 ;;
          esac
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -R 80:localhost:$LOCAL_PORT localhost.run > localhost.log 2>&1 &
          sleep 20
          URL=$(grep -o 'https://[a-z0-9-]*\.lhr\.life' localhost.log | head -1)
          if [[ -n "$URL" ]]; then
            echo "LOCALHOST_URL=$URL" >> $GITHUB_ENV
            echo "Localhost.run: $URL"
          else
            echo "LOCALHOST_URL=pending" >> $GITHUB_ENV
          fi

      - name: PHASE 4E - Bore Tunnel
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'bore-tunnel' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting Bore Tunnel ==="
          BORE=""
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            curl -fsSL -o "$TEMP/bore.zip" \
              "https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.0-x86_64-pc-windows-msvc.zip" 2>/dev/null || true
            if [[ -f "$TEMP/bore.zip" ]]; then
              unzip -o "$TEMP/bore.zip" -d "$TEMP" 2>/dev/null
              BORE="$TEMP/bore.exe"
            fi
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install bore-cli 2>/dev/null || true
            BORE="bore"
          else
            curl -fsSL -o /tmp/bore.tar.gz \
              "https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" 2>/dev/null || true
            if [[ -f "/tmp/bore.tar.gz" ]]; then
              tar xzf /tmp/bore.tar.gz -C /tmp 2>/dev/null
              chmod +x /tmp/bore
              BORE="/tmp/bore"
            fi
          fi
          if [[ -z "$BORE" ]] || [[ ! -x "$BORE" ]]; then
            echo "Bore not available, skipping"
            exit 0
          fi
          case "${{ inputs.remote_method }}" in
            ssh) BORE_PORT=22 ;;
            rdp|xrdp|vnc) BORE_PORT=3389 ;;
            rustdesk) BORE_PORT=21115 ;;
            *) BORE_PORT=3389 ;;
          esac
          nohup $BORE local $BORE_PORT --to bore.pub > bore.log 2>&1 &
          sleep 10
          echo "Bore tunnel started on port $BORE_PORT"

      # ============================================================
      # PHASE 5: PRINT CONNECTION INFO
      # ============================================================
      - name: PHASE 5 - Print All Connection Methods
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           ALL CONNECTIVITY OPTIONS                           ║"
          echo "║           $(date '+%Y-%m-%d %H:%M:%S')                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  OS:      ${{ inputs.os_image }}                              "
          echo "║  Runtime: ${{ inputs.runtime_minutes }} minutes (max 6 hours) "
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║           PRIORITY REMOTES (TOP)                             ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Chrome Remote Desktop:                                      ║"
          echo "║    PIN:      ${{ inputs.crd_pin }}                            "
          echo "║    Code:     ${{ inputs.crd_code }}                           "
          echo "║    Status:   ${{ env.CRD_STATUS }}                            "
          echo "║  Tailscale:  ${{ env.TAILSCALE_IP }} (persistent VPN)         "
          echo "║  RustDesk:                                                   ║"
          echo "║    ID:       ${{ env.RUSTDESK_ID }}                           "
          echo "║    Password: ${{ env.RUSTDESK_PASS }}                         "
          echo "║    Screenshot: ${{ env.SCREENSHOT_URL }}                      "
          echo "║  XRDP:       ${{ env.TAILSCALE_IP }}:3389                     "
          echo "║    User:     runner                                           "
          echo "║    Pass:     runner@12345                                     "
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║           TUNNELS / NETWORK ACCESS                           ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Cloudflare:  ${{ env.CF_URL }}                               "
          echo "║  Ngrok:       ${{ env.NGROK_URL }}                            "
          echo "║  LocalTunnel: ${{ env.LOCALHOST_URL }}                        "
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║           OTHER REMOTE DESKTOP METHODS                       ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  SSH:   ssh runner@${{ env.TAILSCALE_IP }}                    "
          echo "║         Pass: runner@12345                                    "
          echo "║  RDP:   mstsc /v:${{ env.TAILSCALE_IP }}                      "
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

      # ============================================================
      # PHASE 6: KEEP ALIVE
      # ============================================================
      - name: PHASE 6 - Keep Alive - 6 Hour Loop
        run: |
          RUNTIME=${{ inputs.runtime_minutes }}
          [[ -z "$RUNTIME" ]] && RUNTIME=360
          for ((i=RUNTIME; i>0; i--)); do
            echo "[$(date '+%H:%M:%S')] ${i}m remaining"
            echo "  Chrome Remote Desktop PIN: ${{ inputs.crd_pin }}"
            echo "  Tailscale:  ${{ env.TAILSCALE_IP }}"
            echo "  RustDesk:   ${{ env.RUSTDESK_ID }} / Pass: ${{ env.RUSTDESK_PASS }}"
            echo "  XRDP:       ${{ env.TAILSCALE_IP }}:3389"
            echo "  Ngrok:      ${{ env.NGROK_URL }}"
            echo "  Cloudflare: ${{ env.CF_URL }}"
            echo "  Localhost:  ${{ env.LOCALHOST_URL }}"

            if [[ "${{ inputs.os_image }}" == "ubuntu-latest" ]]; then
              sudo systemctl is-active xrdp >/dev/null 2>&1 && echo "  XRDP: Running" || echo "  XRDP: Stopped"
              sudo systemctl is-active ssh >/dev/null 2>&1 && echo "  SSH:  Running" || echo "  SSH: Stopped"
            fi

            if [[ -n "${{ env.TAILSCALE_IP }}" ]]; then
              tailscale ping -c 1 ${{ env.TAILSCALE_IP }} >/dev/null 2>&1 && echo "  Tailscale ping OK" || echo "  Tailscale ping FAIL"
            fi

            sleep 60
          done
          echo "Runtime completed. Shutting down..."
