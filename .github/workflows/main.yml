name: All-Connect Remote Desktop (6 Hours)

"on":
  workflow_dispatch:
    inputs:
      os_image:
        description: "OS Image"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      remote_method:
        description: "Primary Remote Method"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - rdp
          - ssh
          - xrdp
          - vnc
          - rustdesk
          - teamviewer
          - anydesk
          - chrome-remote-desktop
          - parsec
      tunnels:
        description: "Tunnels"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - tailscale
          - ngrok
          - cloudflare-tunnel
          - localhost-run
          - bore-tunnel
          - telebit
          - pagekite
          - localtunnel
          - expose
      ts_authkey:
        description: "Tailscale Auth Key (required for tailscale)"
        required: false
      ngrok_token:
        description: "Ngrok Authtoken (required for ngrok)"
        required: false
      cf_token:
        description: "Cloudflare Token (optional)"
        required: false
      teamviewer_id:
        description: "TeamViewer ID (optional)"
        required: false
      anydesk_id:
        description: "AnyDesk ID (optional)"
        required: false
      crd_code:
        description: "Chrome Remote Desktop Code (optional)"
        required: false
      crd_pin:
        description: "CRD PIN (6-12 digits)"
        required: false
        default: "123456"
      runtime_minutes:
        description: "Runtime (max 360 = 6 hours)"
        required: false
        default: "360"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Inputs
        run: |
          OS="${{ inputs.os_image }}"
          METHOD="${{ inputs.remote_method }}"
          TUNNEL="${{ inputs.tunnels }}"
          if [[ "$METHOD" != "all" ]]; then
            case "$OS" in
              windows-latest)
                [[ ! "$METHOD" =~ ^(rdp|rustdesk|teamviewer|anydesk|chrome-remote-desktop|parsec)$ ]] && { echo "Not available on Windows"; exit 1 }
                ;;
              ubuntu-latest)
                [[ ! "$METHOD" =~ ^(ssh|xrdp|vnc|rustdesk|teamviewer|anydesk|chrome-remote-desktop|parsec)$ ]] && { echo "Not available on Linux"; exit 1 }
                ;;
              macos-latest)
                [[ ! "$METHOD" =~ ^(ssh|vnc|rustdesk|teamviewer|anydesk|chrome-remote-desktop|parsec)$ ]] && { echo "Not available on macOS"; exit 1 }
                ;;
            esac
          fi
          if [[ "$TUNNEL" == "all" || "$TUNNEL" == "tailscale" ]] && [[ -z "${{ inputs.ts_authkey }}" ]]; then
            echo "::warning::Tailscale selected but no authkey provided"
          fi
          if [[ "$TUNNEL" == "all" || "$TUNNEL" == "ngrok" ]] && [[ -z "${{ inputs.ngrok_token }}" ]]; then
            echo "::warning::Ngrok selected but no token provided"
          fi
          echo "Validation passed"

  remote-desktop:
    needs: validate
    runs-on: ${{ inputs.os_image }}
    timeout-minutes: 370
    env:
      USER_WIN: Admin
      PASS_WIN: Admin@12345
      USER_NIX: runner
      PASS_NIX: runner@12345

    steps:
      # ============================================================
      # SETUP BASE SYSTEM
      # ============================================================
      - name: Setup Base Linux Environment
        if: ${{ inputs.os_image == 'ubuntu-latest' }}
        run: |
          echo "=== Updating System ==="
          sudo apt-get update -y
          sudo apt-get install -y curl wget net-tools iputils-ping software-properties-common apt-transport-https ca-certificates gnupg lsb-release
          echo "Base packages installed"

      # ============================================================
      # PRIORITY TUNNEL 1 - Tailscale
      # ============================================================
      - name: TUNNEL 1 - Tailscale
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'tailscale' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Installing Tailscale ==="
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            curl -fsSL -o "$TEMP/tailscale.msi" "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
            msiexec /i "$TEMP/tailscale.msi" /quiet /norestart
            "/c/Program Files/Tailscale/tailscale.exe" logout 2>/dev/null || true
            "/c/Program Files/Tailscale/tailscale.exe" up --authkey="${{ inputs.ts_authkey }}" --hostname="gh-${{ github.run_id }}" --accept-dns --accept-routes
            IP=$("/c/Program Files/Tailscale/tailscale.exe" ip -4 | head -1)
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install tailscale
            sudo tailscale up --authkey="${{ inputs.ts_authkey }}" --hostname="gh-${{ github.run_id }}"
            IP=$(sudo tailscale ip -4 | head -1)
          else
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo tailscale up --authkey="${{ inputs.ts_authkey }}" --hostname="gh-${{ github.run_id }}" --accept-dns --accept-routes
            IP=$(tailscale ip -4 | head -1)
          fi
          echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
          echo "✅ Tailscale IP: $IP"

      # ============================================================
      # PRIORITY TUNNEL 2 - Ngrok
      # ============================================================
      - name: TUNNEL 2 - Ngrok
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'ngrok' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Installing Ngrok ==="
          NGROK=""
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            choco install ngrok -y 2>/dev/null || true
            if command -v ngrok &> /dev/null; then
              NGROK="ngrok"
            else
              curl -fsSL -o "$TEMP/ngrok.zip" "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" 2>/dev/null ||               curl -fsSL -o "$TEMP/ngrok.zip" "https://github.com/ngrok/ngrok/releases/latest/download/ngrok-stable-windows-amd64.zip" 2>/dev/null || true
              if [[ -f "$TEMP/ngrok.zip" ]]; then
                unzip -o "$TEMP/ngrok.zip" -d "$TEMP" 2>/dev/null
                NGROK="$TEMP/ngrok.exe"
              fi
            fi
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install ngrok/ngrok/ngrok 2>/dev/null || brew install ngrok 2>/dev/null || true
            NGROK="ngrok"
          else
            sudo snap install ngrok 2>/dev/null || true
            if command -v ngrok &> /dev/null; then
              NGROK="ngrok"
            else
              curl -fsSL -o /tmp/ngrok.tgz "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" 2>/dev/null ||               curl -fsSL -o /tmp/ngrok.tgz "https://github.com/ngrok/ngrok/releases/latest/download/ngrok-stable-linux-amd64.tgz" 2>/dev/null || true
              if [[ -f "/tmp/ngrok.tgz" ]]; then
                tar xzf /tmp/ngrok.tgz -C /tmp 2>/dev/null
                chmod +x /tmp/ngrok
                NGROK="/tmp/ngrok"
              fi
            fi
          fi
          if [[ -z "$NGROK" ]] || [[ ! -x "$NGROK" ]]; then
            echo "❌ Ngrok installation failed"
            exit 1
          fi
          if [[ -n "${{ inputs.ngrok_token }}" ]]; then
            $NGROK authtoken "${{ inputs.ngrok_token }}"
          fi
          case "${{ inputs.remote_method }}" in
            rdp|xrdp|vnc) PORT=3389 ;;
            ssh) PORT=22 ;;
            rustdesk) PORT=21115 ;;
            *) PORT=3389 ;;
          esac
          $NGROK tcp $PORT > ngrok.log 2>&1 &
          sleep 15
          URL=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null | grep -o '"public_url":"tcp://[^"]*' | cut -d'"' -f4)
          if [[ -n "$URL" ]]; then
            echo "NGROK_URL=$URL" >> $GITHUB_ENV
            echo "NGROK_PORT=$(echo $URL | cut -d: -f3)" >> $GITHUB_ENV
            echo "✅ Ngrok: $URL"
          else
            echo "⚠️ Ngrok started but URL not available yet"
            echo "NGROK_URL=pending" >> $GITHUB_ENV
          fi

      # ============================================================
      # PRIORITY REMOTE 1 - RustDesk (FIXED)
      # ============================================================
      - name: REMOTE 1 - RustDesk
        if: ${{ inputs.remote_method == 'all' || inputs.remote_method == 'rustdesk' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Installing RustDesk ==="
          LATEST=$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest             | grep '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          echo "Latest RustDesk version: $LATEST"
          if [[ -z "$LATEST" ]]; then
            LATEST="1.4.6"
          fi
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            curl -fsSL -o "$TEMP/rustdesk.exe"               "https://github.com/rustdesk/rustdesk/releases/download/${LATEST}/rustdesk-${LATEST}-x86_64.exe"
            "$TEMP/rustdesk.exe" --silent-install 1>/dev/null 2>&1
            sleep 10
            netsh advfirewall firewall add rule name="RD-RustDesk" dir=in action=allow protocol=TCP localport=21115-21119
            netsh advfirewall firewall add rule name="RD-RustDesk-UDP" dir=in action=allow protocol=UDP localport=21116
            powershell -Command "& 'C:\Program Files\RustDesk\rustdesk.exe' --password rustdesk123" 2>/dev/null || true
            sleep 2
            RDID=$(powershell -Command "& 'C:\Program Files\RustDesk\rustdesk.exe' --get-id" 2>/dev/null | tr -d '\r' || echo "check-app")
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install --cask rustdesk
            open /Applications/RustDesk.app
            sleep 10
            RDID=$(rustdesk --get-id 2>/dev/null || echo "check-app")
          else
            wget -q "https://github.com/rustdesk/rustdesk/releases/download/${LATEST}/rustdesk-${LATEST}-x86_64.deb" -O /tmp/rustdesk.deb
            sudo dpkg -i /tmp/rustdesk.deb 2>/dev/null || sudo apt-get install -f -y
            mkdir -p ~/.config/rustdesk
            echo "rustdesk123" > ~/.config/rustdesk/password
            chmod 600 ~/.config/rustdesk/password
            rustdesk --password rustdesk123 &
            sleep 10
            RDID=$(rustdesk --get-id 2>/dev/null || echo "check-app")
            sudo ufw allow 21115:21119/tcp 2>/dev/null || true
            sudo iptables -I INPUT -p tcp --dport 21115:21119 -j ACCEPT 2>/dev/null || true
            sudo iptables -I INPUT -p udp --dport 21116 -j ACCEPT 2>/dev/null || true
          fi
          echo "RUSTDESK_ID=$RDID" >> $GITHUB_ENV
          echo "RUSTDESK_PASS=rustdesk123" >> $GITHUB_ENV
          echo "✅ RustDesk ID: $RDID"
          echo "✅ RustDesk Pass: rustdesk123"

      # ============================================================
      # REMOTE 2 - Chrome Remote Desktop
      # ============================================================
      - name: REMOTE 2 - Chrome Remote Desktop
        if: ${{ inputs.remote_method == 'all' || inputs.remote_method == 'chrome-remote-desktop' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Chrome Remote Desktop ==="
          if [[ -z "${{ inputs.crd_code }}" ]]; then
            echo "⚠️ No CRD code provided, skipping"
            exit 0
          fi
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            curl -fsSL -o "$TEMP/crd.msi" "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
            msiexec /i "$TEMP/crd.msi" /quiet /norestart
            "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"               --code="${{ inputs.crd_code }}"               --redirect-url="https://remotedesktop.google.com/_/oauthredirect"               --name="$COMPUTERNAME"               --pin="${{ inputs.crd_pin }}"
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install --cask chrome-remote-desktop
            /Applications/Chrome\ Remote\ Desktop\ Host.app/Contents/MacOS/remoting_start_host               --code="${{ inputs.crd_code }}"               --redirect-url="https://remotedesktop.google.com/_/oauthredirect"               --name="$HOSTNAME"               --pin="${{ inputs.crd_pin }}"
          else
            wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
            sudo dpkg -i chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y
            DISPLAY= /opt/google/chrome-remote-desktop/start-host               --code="${{ inputs.crd_code }}"               --redirect-url="https://remotedesktop.google.com/_/oauthredirect"               --name="$HOSTNAME"               --pin="${{ inputs.crd_pin }}"
          fi
          echo "✅ CRD launched with PIN ${{ inputs.crd_pin }}"

      # ============================================================
      # REMOTE 3 - Windows RDP
      # ============================================================
      - name: REMOTE 3 - Windows RDP
        if: ${{ inputs.os_image == 'windows-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'rdp') }}
        continue-on-error: true
        shell: pwsh
        run: |
          $u=$env:USER_WIN; $p=$env:PASS_WIN
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "✅ RDP: user=$u / pass=$p"

      # ============================================================
      # REMOTE 4 - Linux XRDP (BULLETPROOF - FULL DESKTOP)
      # ============================================================
      - name: REMOTE 4 - Linux XRDP
        if: ${{ inputs.os_image == 'ubuntu-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'xrdp') }}
        continue-on-error: false
        run: |
          echo "=== Installing Full Linux Desktop Environment ==="
          export DEBIAN_FRONTEND=noninteractive

          # Update and install desktop + XRDP + SSH
          sudo apt-get update -y
          sudo apt-get install -y xfce4 xfce4-goodies xrdp xorgxrdp openssh-server

          # CRITICAL FIX: Configure XRDP startup script properly [^3^]
          sudo tee /etc/xrdp/startwm.sh > /dev/null << 'EOF'
          #!/bin/sh
          # XRDP session startup script - FIXED for GitHub Actions

          # Load essential paths
          if [ -r /etc/profile ]; then . /etc/profile; fi

          # UNSET conflicting environment variables [^3^]
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          # Start XFCE desktop
          startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # Configure XRDP settings - FIX color depth to 32 (not 128) [^3^]
          sudo sed -i 's/^port=.*/port=3389/' /etc/xrdp/xrdp.ini 2>/dev/null || true
          sudo sed -i 's/^max_bpp=.*/max_bpp=32/' /etc/xrdp/xrdp.ini 2>/dev/null || true
          sudo sed -i 's/^xserverbpp=.*/xserverbpp=32/' /etc/xrdp/xrdp.ini 2>/dev/null || true

          # Configure sesman
          sudo sed -i 's/^KillDisconnected=.*/KillDisconnected=true/' /etc/xrdp/sesman.ini 2>/dev/null || true
          sudo sed -i 's/^DisconnectedTimeLimit=.*/DisconnectedTimeLimit=0/' /etc/xrdp/sesman.ini 2>/dev/null || true

          # Add user to ssl-cert group for XRDP
          sudo usermod -aG ssl-cert $USER

          # CRITICAL: Set password using multiple methods to ensure it works
          echo "runner:$PASS_NIX" | sudo chpasswd
          sudo usermod -p $(openssl passwd -1 "$PASS_NIX") runner 2>/dev/null || true

          # Ensure runner user exists with proper shell
          sudo usermod -s /bin/bash runner 2>/dev/null || true

          # Create .xsession for runner user
          sudo bash -c 'echo "xfce4-session" > /home/runner/.xsession'
          sudo chown runner:runner /home/runner/.xsession 2>/dev/null || true
          sudo chmod 644 /home/runner/.xsession 2>/dev/null || true

          # Also create for current user
          echo "xfce4-session" > ~/.xsession
          chmod 644 ~/.xsession

          # Enable and start XRDP
          sudo systemctl enable xrdp || true
          sudo systemctl restart xrdp || sudo service xrdp restart || true
          sleep 3
          sudo systemctl status xrdp --no-pager || true

          # Open firewall
          sudo ufw allow 3389/tcp 2>/dev/null || true
          sudo iptables -I INPUT -p tcp --dport 3389 -j ACCEPT 2>/dev/null || true

          # Verify XRDP is listening
          sudo ss -tlnp | grep 3389 || sudo netstat -tlnp | grep 3389 || echo "WARNING: XRDP not listening on 3389"

          echo "✅ XRDP: user=runner / pass=$PASS_NIX"
          echo "✅ XRDP Desktop ready on port 3389"

      # ============================================================
      # REMOTE 5 - macOS VNC
      # ============================================================
      - name: REMOTE 5 - macOS VNC
        if: ${{ inputs.os_image == 'macos-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'vnc') }}
        continue-on-error: true
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart             -activate -configure -access -on -restart -agent -privs -all
          sudo systemsetup -setremotelogin on
          echo "runner:$PASS_NIX" | sudo chpasswd
          echo "✅ VNC + SSH: user=runner / pass=$PASS_NIX"

      # ============================================================
      # REMOTE 6 - SSH (BULLETPROOF - GUARANTEED PASSWORD AUTH)
      # ============================================================
      - name: REMOTE 6 - SSH
        if: ${{ inputs.os_image != 'windows-latest' && (inputs.remote_method == 'all' || inputs.remote_method == 'ssh') }}
        continue-on-error: false
        run: |
          echo "=== Configuring SSH with Password Authentication ==="

          if [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            sudo systemsetup -setremotelogin on
          else
            # Ubuntu/Linux
            sudo apt-get install -y openssh-server
            sudo systemctl enable ssh || true
            sudo systemctl start ssh || sudo service ssh start || true

            # CRITICAL FIX: Backup original config and create new one
            sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak

            # Force password authentication
            sudo tee /etc/ssh/sshd_config.d/99-github-actions.conf > /dev/null << 'EOF'
            PasswordAuthentication yes
            PermitRootLogin no
            ChallengeResponseAuthentication yes
            UsePAM yes
            AuthenticationMethods password
            EOF

            # Remove any deny rules
            sudo sed -i '/^DenyUsers/d' /etc/ssh/sshd_config
            sudo sed -i '/^DenyGroups/d' /etc/ssh/sshd_config

            # Ensure PAM is properly configured
            sudo sed -i 's/^@include common-auth/#@include common-auth/' /etc/pam.d/sshd 2>/dev/null || true

            # Restart SSH to apply changes
            sudo systemctl restart ssh || sudo service ssh restart || true
            sleep 2
            sudo systemctl status ssh --no-pager || true
          fi

          # Set password using multiple methods
          echo "runner:$PASS_NIX" | sudo chpasswd
          sudo usermod -p $(openssl passwd -1 "$PASS_NIX") runner 2>/dev/null || true

          # Verify password was set
          echo "Verifying password for runner..."
          sudo passwd -S runner || true

          # Open firewall
          sudo ufw allow 22/tcp 2>/dev/null || true
          sudo iptables -I INPUT -p tcp --dport 22 -j ACCEPT 2>/dev/null || true

          # Verify SSH is listening
          sudo ss -tlnp | grep :22 || sudo netstat -tlnp | grep :22 || echo "WARNING: SSH not listening on port 22"

          echo "✅ SSH: user=runner / pass=$PASS_NIX"
          echo "✅ SSH ready on port 22"

      # ============================================================
      # TUNNEL 3 - Cloudflare Tunnel
      # ============================================================
      - name: TUNNEL 3 - Cloudflare Tunnel
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'cloudflare-tunnel' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Installing Cloudflared ==="
          if [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install cloudflared 2>/dev/null || true
          elif [[ "${{ inputs.os_image }}" == "ubuntu-latest" ]]; then
            curl -fsSL -o /tmp/cloudflared.deb               "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" 2>/dev/null || true
            if [[ -f "/tmp/cloudflared.deb" ]]; then
              sudo dpkg -i /tmp/cloudflared.deb 2>/dev/null || sudo apt-get install -f -y 2>/dev/null || true
            fi
          else
            echo "Cloudflare Tunnel not available on Windows"
            exit 0
          fi
          if command -v cloudflared &> /dev/null; then
            case "${{ inputs.remote_method }}" in
              ssh) CF_PORT=22 ;;
              rdp|xrdp|vnc) CF_PORT=3389 ;;
              rustdesk) CF_PORT=21115 ;;
              *) CF_PORT=3389 ;;
            esac
            nohup cloudflared tunnel --url "tcp://localhost:$CF_PORT" > cf.log 2>&1 &
            sleep 15
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            if [[ -n "$URL" ]]; then
              echo "CF_URL=$URL" >> $GITHUB_ENV
              echo "✅ Cloudflare: $URL"
            else
              echo "CF_URL=pending" >> $GITHUB_ENV
              echo "⚠️ Cloudflare URL pending..."
            fi
          fi

      # ============================================================
      # TUNNEL 4 - Localhost.run
      # ============================================================
      - name: TUNNEL 4 - Localhost.run
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'localhost-run' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Starting Localhost.run ==="
          case "${{ inputs.remote_method }}" in
            ssh) LOCAL_PORT=22 ;;
            rdp|xrdp|vnc) LOCAL_PORT=3389 ;;
            rustdesk) LOCAL_PORT=21115 ;;
            *) LOCAL_PORT=3389 ;;
          esac
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60             -R 80:localhost:$LOCAL_PORT localhost.run > localhost.log 2>&1 &
          sleep 20
          URL=$(grep -o 'https://[a-z0-9-]*\.lhr\.life' localhost.log | head -1)
          if [[ -n "$URL" ]]; then
            echo "LOCALHOST_URL=$URL" >> $GITHUB_ENV
            echo "✅ Localhost.run: $URL"
          else
            echo "LOCALHOST_URL=pending" >> $GITHUB_ENV
            echo "⚠️ Localhost.run URL pending..."
          fi

      # ============================================================
      # TUNNEL 5 - Bore Tunnel
      # ============================================================
      - name: TUNNEL 5 - Bore Tunnel
        if: ${{ inputs.tunnels == 'all' || inputs.tunnels == 'bore-tunnel' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Installing Bore ==="
          BORE=""
          if [[ "${{ inputs.os_image }}" == "windows-latest" ]]; then
            curl -fsSL -o "$TEMP/bore.zip"               "https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.0-x86_64-pc-windows-msvc.zip" 2>/dev/null || true
            if [[ -f "$TEMP/bore.zip" ]]; then
              unzip -o "$TEMP/bore.zip" -d "$TEMP" 2>/dev/null
              BORE="$TEMP/bore.exe"
            fi
          elif [[ "${{ inputs.os_image }}" == "macos-latest" ]]; then
            brew install bore-cli 2>/dev/null || true
            BORE="bore"
          else
            curl -fsSL -o /tmp/bore.tar.gz               "https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" 2>/dev/null || true
            if [[ -f "/tmp/bore.tar.gz" ]]; then
              tar xzf /tmp/bore.tar.gz -C /tmp 2>/dev/null
              chmod +x /tmp/bore
              BORE="/tmp/bore"
            fi
          fi
          if [[ -z "$BORE" ]] || [[ ! -x "$BORE" ]]; then
            echo "Bore not available, skipping"
            exit 0
          fi
          case "${{ inputs.remote_method }}" in
            ssh) BORE_PORT=22 ;;
            rdp|xrdp|vnc) BORE_PORT=3389 ;;
            rustdesk) BORE_PORT=21115 ;;
            *) BORE_PORT=3389 ;;
          esac
          nohup $BORE local $BORE_PORT --to bore.pub > bore.log 2>&1 &
          sleep 10
          echo "✅ Bore tunnel started on port $BORE_PORT"

      # ============================================================
      # PRINT ALL CONNECTION METHODS
      # ============================================================
      - name: Print All Connection Methods
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           ALL CONNECTIVITY OPTIONS                           ║"
          echo "║           $(date '+%Y-%m-%d %H:%M:%S')                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  OS:      ${{ inputs.os_image }}                              "
          echo "║  Runtime: ${{ inputs.runtime_minutes }} minutes (max 6 hours) "
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║           PRIORITY REMOTES                                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  RustDesk:                                                    "
          echo "║    ID:       ${{ env.RUSTDESK_ID }}                           "
          echo "║    Password: rustdesk123                                      "
          echo "║  Tailscale:  ${{ env.TAILSCALE_IP }} (persistent VPN)         "
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║           TUNNELS / NETWORK ACCESS                           ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Cloudflare:  ${{ env.CF_URL }}                               "
          echo "║  Ngrok:       ${{ env.NGROK_URL }}                            "
          echo "║  LocalTunnel: ${{ env.LOCALHOST_URL }}                        "
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║           OTHER REMOTE DESKTOP METHODS                       ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  XRDP:  ${{ env.TAILSCALE_IP }}:3389  User: runner  Pass: runner@12345"
          echo "║  SSH:   ssh runner@${{ env.TAILSCALE_IP }}  Pass: runner@12345"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  RDP:   mstsc /v:${{ env.TAILSCALE_IP }}                      "
          echo "║  SSH:   ssh runner@${{ env.TAILSCALE_IP }}                    "
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

      # ============================================================
      # KEEP ALIVE LOOP
      # ============================================================
      - name: Keep Alive - 6 Hour Loop
        run: |
          RUNTIME=${{ inputs.runtime_minutes }}
          [[ -z "$RUNTIME" ]] && RUNTIME=360
          for ((i=RUNTIME; i>0; i--)); do
            echo "[$(date '+%H:%M:%S')] ${i}m remaining"
            echo "  RustDesk:  ${{ env.RUSTDESK_ID }} / Pass: rustdesk123"
            echo "  Tailscale: ${{ env.TAILSCALE_IP }}"
            echo "  Ngrok:     ${{ env.NGROK_URL }}"
            echo "  Cloudflare: ${{ env.CF_URL }}"
            echo "  Localhost: ${{ env.LOCALHOST_URL }}"

            # Test services are running
            if [[ "${{ inputs.os_image }}" == "ubuntu-latest" ]]; then
              sudo systemctl is-active xrdp >/dev/null 2>&1 && echo "  XRDP: Running" || echo "  XRDP: Stopped"
              sudo systemctl is-active ssh >/dev/null 2>&1 && echo "  SSH:  Running" || echo "  SSH:  Stopped"
            fi

            # Tailscale ping test
            if [[ -n "${{ env.TAILSCALE_IP }}" ]]; then
              tailscale ping -c 1 ${{ env.TAILSCALE_IP }} >/dev/null 2>&1 && echo "  Tailscale ping OK" || echo "  Tailscale ping FAIL"
            fi

            sleep 60
          done
          echo "Runtime completed. Shutting down..."
